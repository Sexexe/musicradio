.eq-panel{background:var(--panel);padding:12px 15px;display:flex;gap:15px;justify-content:center;align-items:center;border-top:1px solid var(--border);position:relative;z-index:2;transition:background .3s ease,border-color .3s ease;}
.eq-group{display:flex;align-items:center;gap:6px;flex:1;justify-content:center;}
.eq-label{font-family:'Myriad','Arial',sans-serif;font-size:.45rem;letter-spacing:1px;color:var(--text-dim);text-transform:uppercase;}
.eq-value{font-family:'Myriad','Arial',sans-serif;font-size:.45rem;color:var(--text);width:28px;text-align:left;}
.bottom-stack input[type="range"]{-webkit-appearance:none;appearance:none;width:100%;max-width:80px;height:4px;border-radius:2px;background:var(--border);outline:none;cursor:pointer;}
.bottom-stack input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:14px;height:14px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan-glow);cursor:pointer;}
.bottom-stack input[type="range"]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--cyan);border:0;box-shadow:0 0 8px var(--cyan-glow);cursor:pointer;}
.remote{background:var(--panel);padding:15px 20px 25px;display:flex;justify-content:center;align-items:center;gap:16px;position:relative;z-index:1;transition:background .3s ease;}
.np-btn{background:linear-gradient(145deg,var(--panel),var(--bg));border:1px solid var(--border);color:var(--text-dim);width:50px;height:50px;border-radius:50%;cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center;transition:all .3s cubic-bezier(.4,0,.2,1);box-shadow:2px 2px 4px rgba(0,0,0,.1),-2px -2px 4px rgba(255,255,255,.05);}
.np-btn:hover{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 10px var(--cyan-glow),inset 0 0 8px var(--cyan-dim);transform:scale(1.05);}
.np-btn:active{transform:scale(.95);box-shadow:inset 2px 2px 4px rgba(0,0,0,.1),inset -2px -2px 4px rgba(255,255,255,.05);}
.np-btn.rec-btn.recording{color:var(--red);border-color:var(--red);animation:recPulse 1.5s infinite;}

.ctrl-icon{display:inline-block;position:relative;z-index:1;}
.ctrl-icon.play-icon{width:0;height:0;border-top:9px solid transparent;border-bottom:9px solid transparent;border-left:14px solid currentColor;margin-left:3px;}
.ctrl-icon.stop-icon{width:16px;height:16px;background:currentColor;border-radius:2px;}
.ctrl-icon.rec-icon{width:16px;height:16px;background:currentColor;border-radius:50%;}
.ctrl-icon.prev-icon,.ctrl-icon.next-icon{width:16px;height:16px;position:relative;}
.ctrl-icon.prev-icon::before{content:'';position:absolute;top:0;left:4px;width:0;height:0;border-top:8px solid transparent;border-bottom:8px solid transparent;border-right:12px solid currentColor;}
.ctrl-icon.prev-icon::after{content:'';position:absolute;top:0;left:0;width:2px;height:16px;background:currentColor;}
.ctrl-icon.next-icon::before{content:'';position:absolute;top:0;left:0;width:0;height:0;border-top:8px solid transparent;border-bottom:8px solid transparent;border-left:12px solid currentColor;}
.ctrl-icon.next-icon::after{content:'';position:absolute;top:0;right:0;width:2px;height:16px;background:currentColor;}

.modal-backdrop{position:absolute;inset:0;z-index:700;background:rgba(0,0,0,.55);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;padding:20px;overflow:hidden}

function buildRadio(){if(radioBlobUrl)return radioBlobUrl;
 var raw=document.getElementById('radioSrc').textContent;
 var html=raw.replace(/<\\\/script>/g,'<\/script>');
 html=html.replace('</body>',RADIO_INJECT+'</body>');
 radioBlobUrl=URL.createObjectURL(new Blob([html],{type:'text/html'}));return radioBlobUrl;}
function cmd(c,val){if(radioFrame.contentWindow)radioFrame.contentWindow.postMessage({type:'mro:cmd',cmd:c,val:val},'*');}
function syncModeBtn(){var b=$('radioBtn');if(!b)return;b.textContent=radioOpen?'VIDEO':'RADIO';b.classList.toggle('on',radioOpen);}
function openRadio(station){if(rec.active)stopRec();try{video.pause();}catch(e){}
 radioOpen=true;document.body.classList.add('radio-on');radioFrame.classList.add('on');
 syncModeBtn();
 if(!radioReady){radioFrame.src=buildRadio();radioReady=true;}
 if(station){radioPendingStation=station;trySendPlay();}
 syncPlay();}
function trySendPlay(){if(radioPendingStation&&radioFrame.contentWindow)radioFrame.contentWindow.postMessage({type:'mro:play',station:radioPendingStation},'*');}
radioFrame.addEventListener('load',function(){setTimeout(trySendPlay,300);setTimeout(trySendPlay,1200);});
function closeRadio(){radioOpen=false;cmd('pause');radioFrame.classList.remove('on');document.body.classList.remove('radio-on');
 syncModeBtn();applyFrame();renderAll();syncPlay();
 if(started&&video.paused)video.play().catch(function(){});}
addEventListener('message',function(e){var d=e.data;
 if(d==='mro:video'){closeRadio();return;}
 if(d&&d.type==='mro:state'){radioState=d;if(d.playing){try{video.pause();}catch(err){}}}
});
$('radioBtn').addEventListener('click',function(){if(radioOpen)closeRadio();else openRadio();});
$('brandHome').addEventListener('click',function(){if(radioOpen)closeRadio();});
setTimeout(function(){var b=$('adBand');if(b)b.classList.add('gone');},6000);
$('vPrev').addEventListener('click',function(){step(-1);});
$('vStop').addEventListener('click',stopVideo);

$('vRec').addEventListener('click',toggleRec);
$('vNext').addEventListener('click',function(){step(1);});
$('vBass').addEventListener('input',function(e){setBass(+e.target.value,e.target);});
$('vTreble').addEventListener('input',function(e){setTreble(+e.target.value,e.target);});
$('vVol').addEventListener('input',function(e){setVol(+e.target.value,e.target);});

$('searchIcon').innerHTML=icon('search',14);$('searchClear').innerHTML=icon('close',9);
$('topFs').innerHTML=icon('fs',16);$('fsBtn').innerHTML=icon('fs');
$('prevBtn').innerHTML=icon('prev');$('nextBtn').innerHTML=icon('next');
$('favBtn').innerHTML=icon('star',16);
$('nowFav').innerHTML=icon('star',19);$('badgeFav').innerHTML=icon('star',14);
$('shareIcon').innerHTML=icon('share',11);$('shareCopy').innerHTML=icon('copy',16);$('shareClose').innerHTML=icon('close',14);
$('shareCopyRowIcon').innerHTML=icon('copy',17);$('shareOpenIcon').innerHTML=icon('external',17);
$('shareNativeIcon').innerHTML=icon('share',22);$('tgIcon').innerHTML=icon('send',22);$('waIcon').innerHTML=icon('chat',22);
syncPlay();syncMute();syncRecUI();syncFavButtons();syncModeBtn();
$('playBtn').addEventListener('click',togglePlay);
$('prevBtn').addEventListener('click',function(){step(-1);});
$('nextBtn').addEventListener('click',function(){step(1);});
$('muteBtn').addEventListener('click',function(){setMuted(!S.muted);});
$('topMute').addEventListener('click',function(){setMuted(!S.muted);});
$('recBtn').addEventListener('click',toggleRec);
$('volRange').addEventListener('input',function(e){setVol(+e.target.value,e.target);});
$('fsBtn').addEventListener('click',toggleFs);$('topFs').addEventListener('click',toggleFs);
$('retryBtn').addEventListener('click',function(){$('error').hidden=true;$('loading').hidden=false;startScan(true);});
$('favBtn').addEventListener('click',function(){S.favOnly=!S.favOnly;save();renderAll();});
$('nowFav').addEventListener('click',function(){if(current)toggleFav(current);});
$('badgeFav').addEventListener('click',function(e){e.stopPropagation();if(current)toggleFav(current);});
video.volume=1;video.muted=S.muted;
$('volRange').value=String(S.vol);$('vVol').value=String(S.vol);$('vBass').value=String(S.bass);$('vTreble').value=String(S.treble);
$('vVolVal').textContent=S.vol+'%';$('vBassVal').textContent=(S.bass>0?'+':'')+S.bass+'dB';$('vTrebleVal').textContent=(S.treble>0?'+':'')+S.treble+'dB';
paintVol($('volRange'));
syncSearchClear();applyFrame();placeHeader();renderAll();ensureHls();
(function(){var dl=readHash();
 if(dl&&dl.mode==='radio'){openRadio(dl.key);startScan();return;}
 if(dl&&dl.mode==='video'){pendingKey=dl.key;}
 startScan();
})();
})();
