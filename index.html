.sheet{position:fixed;inset:0;z-index:200;background:var(--overlay);backdrop-filter:blur(7px);display:flex;align-items:center;justify-content:center;padding:20px}
.sheet-card{width:min(520px,100%);max-height:calc(100% - 40px);overflow-y:auto;background:var(--panel);

.link-row input:focus{border-color:var(--cyan)}
.share-grid{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.share-item{flex:1 1 84px;display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 6px;
  border:1px solid var(--border);border-radius:12px;background:linear-gradient(145deg,var(--panel),var(--bg2));
  color:var(--text-dim);font-size:9px;letter-spacing:1.2px;text-transform:uppercase;transition:all .3s var(--ease)}
.share-item:hover{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 12px var(--cyan-glow);transform:translateY(-2px)}
.share-item svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.sheet-actions{display:flex;gap:10px}

.sheet-actions button:hover{box-shadow:0 0 14px var(--cyan-glow)}

.sheet-actions button.ghost:hover{border-color:var(--text-dim);color:var(--text);box-shadow:none}
.toasts{position:fixed;right:16px;bottom:calc(196px + var(--safe-bottom));z-index:300;display:flex;flex-direction:column;gap:8px;max-width:min(340px,calc(100% - 32px))}

  border-radius:10px;padding:10px 13px;font-size:11.5px;letter-spacing:.5px;color:var(--text);
  box-shadow:0 12px 34px rgba(0,0,0,.75);animation:tin .22s var(--ease)}
.toast.warn{border-left-color:var(--amber)}
.toast.bad{border-left-color:var(--red)}
.toast.ok{border-left-color:var(--green)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}

async function playHls(ch,ses){
  var H=await ensureHls();if(ses!==session)return;
  ensureVA();if(VA.ctx&&VA.ctx.state==='suspended')VA.ctx.resume().catch(function(){});
  applyVol();
  var to=setTimeout(function(){if(ses===session&&video.readyState<2)drop(ch);},PLAYTO);
  var clr=function(){clearTimeout(to);};
  var go=function(){
    var p=video.play();
    if(p&&p.then)p.then(function(){$('btnPlay').classList.remove('attention');}).catch(function(){
      if(ses!==session)return;autoMuted=true;applyVol();
      var p2=video.play();
      if(p2&&p2.then)p2.then(function(){$('eqVol').classList.add('pulse');}).catch(function(){clr();$('pLoad').hidden=true;$('btnPlay').classList.add('attention');});
    });
  };
  if(H&&H.isSupported()){
    hls=new H({maxBufferLength:30,manifestLoadingMaxRetry:1,levelLoadingMaxRetry:2,fragLoadingMaxRetry:2});
    var r0=0;
    hls.on(H.Events.MANIFEST_PARSED,function(){if(ses===session)go();});
    hls.on(H.Events.ERROR,function(e,d){
      if(ses!==session||!d.fatal)return;
      if(d.type===H.ErrorTypes.MEDIA_ERROR&&r0<1){r0++;try{hls.recoverMediaError();}catch(x){clr();drop(ch);}return;}
      if(d.type===H.ErrorTypes.NETWORK_ERROR&&r0<2){r0++;setTimeout(function(){if(ses===session&&hls)try{hls.startLoad();}catch(x){clr();drop(ch);}},700);return;}
      clr();drop(ch);
    });
    hls.loadSource(ch.url);hls.attachMedia(video);
  }else if(video.canPlayType('application/vnd.apple.mpegurl')){video.src=ch.url;go();}
  else{clr();drop(ch);}
  video.addEventListener('playing',clr,{once:true});
}
/* сбой канала → следующий ВНИЗ по списку, а не в начало */
function drop(ch){
  var pos=shown.findIndex(function(c){return c.url===ch.url;});
  scan.dead.add(ch.url);scan.deadNames.add(nkey(ch.name));S.dead[ch.url]=1;save();
  var i=channels.findIndex(function(c){return c.id===ch.id;});if(i>=0)channels.splice(i,1);
  var wasCurrent=current&&current.url===ch.url;
  if(wasCurrent){current=null;started=false;}
  renderList();
  if(wasCurrent){
    if(shown.length){
      var ni=(pos>=0&&pos<shown.length)?pos:0;
      tune(shown[ni]);
    }else{
      $('pLoad').hidden=true;
      if(scan.done)$('pErr').hidden=false;
      syncChrome();
    }
  }
  if(channels.length<TARGET&&!scan.running&&!scan.done)startScan();
}
function next(){
  var pool=shown.length?shown:channels;
  if(!pool.length){$('pLoad').hidden=true;if(scan.done)$('pErr').hidden=false;return;}
  var i=current?pool.findIndex(function(c){return c.url===current.url;}):-1;
  tune(pool[(i+1+pool.length)%pool.length]);
}
function prev(){
  var pool=shown.length?shown:channels;if(!pool.length)return;
  var i=current?pool.findIndex(function(c){return c.url===current.url;}):-1;
  tune(pool[(i-1+pool.length)%pool.length]);
}

var rec={mr:null,chunks:[],stream:null,mime:'',t0:0,timer:null,active:false,wasAuto:false};
function pickMime(){
  var c=['video/mp4;codecs=avc1.64003E,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
  for(var i=0;i<c.length;i++)if(window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(c[i]))return c[i];
  return '';
}
function recTick(){var s=Math.floor((Date.now()-rec.t0)/1000);$('pRecTime').textContent=pad2(Math.floor(s/60))+':'+pad2(s%60);}
function finishRec(){
  var ch=rec.chunks;rec.chunks=[];if(!ch.length){toast('Запись пуста','warn');return;}
  var mime=rec.mime||'video/webm',blob=new Blob(ch,{type:mime}),ext=mime.indexOf('mp4')>=0?'mp4':'webm';
  var nm=(current?current.name:'musicradio').replace(/[^\wа-яё\- ]+/gi,'').trim().replace(/\s+/g,'_')||'musicradio';
  var d=new Date(),stamp=''+d.getFullYear()+pad2(d.getMonth()+1)+pad2(d.getDate())+'-'+pad2(d.getHours())+pad2(d.getMinutes());
  var name='MUSICRADIO_'+nm+'_'+stamp+'.'+ext,url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(url);},4000);
  toast('Сохранено: '+name,'ok',5000);
}
function stopRec(){
  if(!rec.active)return;rec.active=false;clearInterval(rec.timer);rec.timer=null;
  var mr=rec.mr;rec.mr=null;
  if(mr&&mr.state!=='inactive'){try{mr.stop();}catch(e){finishRec();}}else finishRec();
  if(rec.stream){rec.stream.getTracks().forEach(function(t){try{t.stop();}catch(e){}});rec.stream=null;}
  if(rec.wasAuto){autoMuted=true;applyVol();}
  syncChrome();
}
function startRec(){
  if(rec.active)return;
  if(!started||!current){toast('Сначала включите канал','warn');return;}
  if(!window.MediaRecorder){toast('Запись не поддерживается','bad');return;}
  ensureVA();if(VA.ctx&&VA.ctx.state==='suspended')VA.ctx.resume().catch(function(){});
  var cs=video.captureStream||video.mozCaptureStream;if(!cs){toast('Запись не поддерживается','bad');return;}
  rec.wasAuto=autoMuted;if(autoMuted){autoMuted=false;applyVol();$('eqVol').classList.remove('pulse');}
  var vs=null;try{vs=cs.call(video);}catch(e){}
  if(!vs){toast('Не удалось получить поток','bad');return;}
  var tracks=vs.getVideoTracks().slice();
  var at=(VA.ctx&&VA.dest)?VA.dest.stream.getAudioTracks():vs.getAudioTracks();
  var stream=new MediaStream(tracks.concat(at));
  var mime=pickMime();if(!mime){toast('Формат записи недоступен','bad');return;}
  var mr;try{mr=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:12000000,audioBitsPerSecond:320000});}
  catch(e){try{mr=new MediaRecorder(stream,{mimeType:mime});}catch(x){toast('Запись не запустилась','bad');return;}}
  rec.mr=mr;rec.chunks=[];rec.stream=stream;rec.mime=mime;
  mr.ondataavailable=function(e){if(e.data&&e.data.size)rec.chunks.push(e.data);};
  mr.onstop=finishRec;
  try{mr.start(1000);}catch(e){toast('Запись не запустилась','bad');return;}
  rec.active=true;rec.t0=Date.now();rec.timer=setInterval(recTick,500);recTick();
  syncChrome();toast('Запись началась','ok');
}

$('favFilter').classList.toggle('on',S.favOnly);
video.muted=true;
(function(){
  var h=location.hash.replace(/^#/,'');
  if(h){try{var p=new URLSearchParams(h);
    var st=p.get('station');
    if(st){pendingKey=st;setMode('radio');startScan();syncChrome();return;}
    var ch=p.get('ch');if(ch)pendingKey=ch;
  }catch(e){}}
  renderList();syncChrome();ensureHls();startScan();
})();
})();
</script>
</body>
